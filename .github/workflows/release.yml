# Create the GitHub release for a repository version. Spack configurations pin
# this repository by tag, so a vX.Y.Z tag is the release; this only attaches
# generated release notes to it. deploy-docs.yml publishes the docs from the
# same tag.
#
# Only a plain vX.Y.Z tag, cut by `just release X.Y.Z`. A docs-only release
# (docs-vX.Y.Z, `just release X.Y.Z --docs-only`) deliberately does not match,
# and tests/test_release_tags.py asserts that rather than trusting this comment.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG}" --verify-tag --generate-notes --title "${TAG}"
